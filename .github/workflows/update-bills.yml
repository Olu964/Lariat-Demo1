name: Update bill summaries

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of bills to fetch (default 25)'
        required: false
        default: '25'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch bills from Open States
        env:
          OPEN_STATES_API_KEY: ${{ secrets.OPEN_STATES_API_KEY }}
          LARIAT_SESSION: ${{ vars.LARIAT_SESSION }}
          FETCH_LIMIT: ${{ inputs.limit || '25' }}
        run: |
          ARGS=(--limit "$FETCH_LIMIT")
          if [ -n "$LARIAT_SESSION" ]; then ARGS+=(--session "$LARIAT_SESSION"); fi
          python3 fetch_texas_bills.py "${ARGS[@]}"

      - name: Summarize bills from official Texas bill text with OpenRouter AI
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUMMARIZER_MODEL: ${{ vars.SUMMARIZER_MODEL }}
        run: |
          if [ -n "$SUMMARIZER_MODEL" ]; then
            python3 summarize_bills.py --model "$SUMMARIZER_MODEL"
          else
            python3 summarize_bills.py
          fi

      - name: Commit regenerated summaries (only when something changed)
        run: |
          git config user.name "lariat-bot"
          git config user.email "lariat-bot@users.noreply.github.com"
          git add Lariat-real/texas_bill_summaries.json Lariat-real/feed.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Texas bill summaries"
            git push
          else
            echo "No changes — nothing to commit"
          fi
