name: Update bill summaries

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of bills to fetch (default 25)'
        required: false
        default: '25'

permissions:
  contents: write

concurrency:
  group: update-bills-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    # Never run the secret-bearing publishing job from an arbitrary branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Both scheduled and manual runs use this same default. A manual run may
      # override it intentionally through workflow_dispatch.inputs.limit.
      FETCH_LIMIT: ${{ inputs.limit || '25' }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify workflow revision
        run: |
          echo "Workflow commit: $(git rev-parse --short HEAD)"
          grep -q "containing exactly two keys: summary and suggested_action" summarize_bills.py
          echo "Summary and suggested-action prompt is active"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Restore official bill-text cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/lariat-bill-text
          # Use a new key per run so newly downloaded official text is saved;
          # restore-keys still retrieves the previous run's cache first.
          key: lariat-bill-text-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            lariat-bill-text-${{ github.ref_name }}-
            lariat-bill-text-

      - name: Install official PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Validate manual fetch limit
        run: |
          case "$FETCH_LIMIT" in
            ''|*[!0-9]*) echo "FETCH_LIMIT must be numeric" >&2; exit 1 ;;
          esac
          if [ "$FETCH_LIMIT" -lt 1 ] || [ "$FETCH_LIMIT" -gt 1000 ]; then
            echo "FETCH_LIMIT must be between 1 and 1000" >&2
            exit 1
          fi

      - name: Fetch bills from Open States
        env:
          OPEN_STATES_API_KEY: ${{ secrets.OPEN_STATES_API_KEY }}
          LARIAT_SESSION: ${{ vars.LARIAT_SESSION }}
        run: |
          ARGS=(--limit "$FETCH_LIMIT")
          if [ -n "$LARIAT_SESSION" ]; then ARGS+=(--session "$LARIAT_SESSION"); fi
          python3 fetch_texas_bills.py "${ARGS[@]}"

      - name: Summarize bills from official Texas bill text with OpenRouter AI
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUMMARIZER_MODEL: ${{ vars.SUMMARIZER_MODEL }}
        run: |
          ARGS=()
          if [ -n "$SUMMARIZER_MODEL" ]; then ARGS+=(--model "$SUMMARIZER_MODEL"); fi
          python3 summarize_bills.py "${ARGS[@]}"

      - name: Commit regenerated summaries (only when something changed)
        if: success()
        run: |
          git config user.name "lariat-bot"
          git config user.email "lariat-bot@users.noreply.github.com"
          git add texas_bill_summaries.json feed.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Texas bill summaries"
            git push
          else
            echo "No changes — nothing to commit"
          fi
